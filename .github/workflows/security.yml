# ============================================================
# Security — supply-chain + secret hygiene, on push/PR + weekly.
#   gitleaks      — secret / credential scanning (full history)
#   cargo-audit   — RustSec advisories against src-tauri/Cargo.lock
#   pnpm-audit    — npm advisories (non-blocking: dev-tree noise)
#   license       — LICENSE present and references MIT
# The weekly cron re-scans so newly published advisories surface
# even with no code change.
# ============================================================
name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs the full git log
          persist-credentials: false
      - name: Install Gitleaks v8.27.2
        run: |
          curl -sSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Detect secrets
        run: gitleaks detect --source . --redact --verbose

  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable # required once pinned to a SHA — the ref no longer names the channel
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit -f src-tauri/Cargo.lock

  pnpm-audit:
    name: pnpm audit (npm advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Non-blocking: transitive dev-dependency advisories are noisy and rarely
    # reachable at runtime. Surfaced as a warning; cargo-audit is the hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  license:
    name: LICENSE present (MIT)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: LICENSE exists and references MIT
        run: |
          shopt -s nullglob
          files=(LICENSE LICENSE.* license LICENSE.md)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No LICENSE file found"
            exit 1
          fi
          if ! grep -qi 'MIT' "${files[0]}"; then
            echo "::error::${files[0]} does not reference the MIT License"
            exit 1
          fi
          echo "License check passed (${files[0]}) ✓"
