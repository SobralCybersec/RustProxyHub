# ============================================================
# Performance — weekly (and on-demand) build-cost tracking.
# Not a hard gate: it records numbers to the job summary so a
# regression in build time or artifact size is visible over runs.
#   frontend  — vite build time + dist/ size
#   rust      — release compile time + stripped binary size
# ============================================================
name: Performance

on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cost:
    name: Build time + artifact size
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            patchelf build-essential file

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Frontend build cost
        run: |
          node ./scripts/prepare-tauri-playwright-resources.mjs
          start=$(date +%s)
          pnpm build
          end=$(date +%s)
          size=$(du -sh dist 2>/dev/null | cut -f1)
          {
            echo "## Frontend (vite)"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Build time | $(( end - start )) s |"
            echo "| dist/ size | ${size:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rust release build cost
        working-directory: src-tauri
        run: |
          start=$(date +%s)
          cargo build --release
          end=$(date +%s)
          bin=$(find target/release -maxdepth 1 -type f -executable ! -name '*.d' | head -1)
          binsize=$( [ -n "$bin" ] && du -h "$bin" | cut -f1 || echo n/a )
          {
            echo "## Rust (release)"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Compile time | $(( end - start )) s |"
            echo "| Binary | \`$(basename "${bin:-none}")\` — ${binsize} |"
          } >> "$GITHUB_STEP_SUMMARY"
