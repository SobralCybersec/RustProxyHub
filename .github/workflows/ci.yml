name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri resources
        run: node ./scripts/prepare-tauri-playwright-resources.mjs

      - name: ESLint
        run: pnpm exec eslint src tests --ext .ts,.vue

      - name: TypeScript
        run: pnpm type-check

      - name: Vitest
        run: pnpm test --run

      - name: Frontend build
        run: pnpm build

      - name: Cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings