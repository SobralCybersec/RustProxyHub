name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri resources
        run: node ./scripts/prepare-tauri-playwright-resources.mjs

      - name: ESLint
        run: pnpm exec eslint src tests --ext .ts,.vue

      - name: TypeScript
        run: pnpm type-check

      - name: Vitest
        run: pnpm test --run

      - name: Node bridge tests
        run: pnpm test:node

      - name: Frontend build
        run: pnpm build

      - name: Cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
