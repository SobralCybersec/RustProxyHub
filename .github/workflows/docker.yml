# ============================================================
# Docker — build the reproducible verify image (docker/Dockerfile),
# cache it via the GitHub Actions cache, and Trivy-scan it.
# On main it's pushed to GHCR so anyone can `docker pull` the exact
# build/verify box. On PRs it's built + loaded but never pushed.
#
# NOTE: this image is a build/verify environment, not the runnable app.
# The desktop app ships as native installers from release.yml.
# ============================================================
name: Docker Verify Image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src-tauri/Cargo.*"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build · scan · (push on main)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: repo
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/verify" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=RustProxyHub verify image
            org.opencontainers.image.description=Reproducible Tauri v2 (Rust) + Vue/pnpm build & verify environment
            org.opencontainers.image.licenses=MIT

      # PR: build + load locally, do not push.
      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # main: build + push to GHCR with provenance + SBOM.
      - name: Build and push (main)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trivy scan (pushed image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.repo.outputs.image }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true # keep the Security tab actionable

      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
